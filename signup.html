<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>myINVOICE</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- signup-page -->
    <main class="signup-main">
      <div class="signup-card">
        <h3><span class="orange">my</span><span class="blue">INVOICE</span></h3>
        <h2>Create Account</h2>
        <p>Start generating invoices in seconds</p>

        <div class="input-group">
          <input type="text" id="signupName" placeholder="Full Name" />
        </div>
        <div class="input-group">
          <input type="email" id="signupEmail" placeholder="Email Address" />
        </div>
        <div class="input-group">
          <input type="password" id="spass" placeholder="Password" />
        </div>

        <button id="signbtn" class="signup-btn">Create Account</button>

        <p class="login-text">
          Already have an account? <a href="login.html">Login</a>
        </p>
      </div>
    </main>

    <!-- footer -->
    <footer class="footer">
      <div class="footer-content">
        <h3>
          <span class="orange">my</span> <span class="blue">INVOICE</span>
        </h3>

        <p>Create and manage invoices</p>

        <div class="footer-links">
          <a href="index.html">Home.</a>
          <a href="index.html">About.</a>
          <a href="index.html">Services.</a>
        </div>

        <p class="copyright">© 2026 myINVOICE. All rights reserved.</p>
      </div>
    </footer>
    <script src="signup.js"></script>
  </body>
</html>
