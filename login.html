<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>myINVOICE - Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- login form -->
    <main class="login-main">
      <div class="login-card">
        <h3><span class="orange">my</span><span class="blue">INVOICE</span></h3>
        <h2>Login Account</h2>
        <p>Start generating invoices in seconds</p>

        <div class="input-group">
          <input type="email" id="loginmail" placeholder="Email Address" />
        </div>
        <div class="input-group">
          <input type="password" id="loginpass" placeholder="Password" />
        </div>

        <button type="button" class="login-btn" id="logtn">Login</button>

        <p class="signup-text">
          Don't have an account? <a href="signup.html">Sign up</a>
        </p>
      </div>
    </main>

    <!-- footer -->
    <footer class="footer">
      <div class="footer-content">
        <h3>
          <span class="orange">my</span> <span class="blue">INVOICE</span>
        </h3>
        <p>Create and manage invoices</p>
        <div class="footer-links">
          <a href="index.html">Home.</a>
          <a href="index.html">About.</a>
          <a href="index.html">Services.</a>
        </div>
        <p class="copyright">© 2026 myINVOICE. All rights reserved.</p>
      </div>
    </footer>
    <script src="login.js"></script>
  </body>
</html>
